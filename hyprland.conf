# ────────────────────────────────────────────────────────────
# Custom Theme for Hyprland
# Made with Omarchist
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(8A8A8D)
    col.inactive_border = rgb(363636)
    border_size = 6
    gaps_in = 5
    gaps_out = 5
}

group {
    col.border_active = rgba(8A8A8Dee)
    col.border_inactive = rgb(363636)

    groupbar {
        col.active = rgba(8A8A8D99)
        col.inactive = rgba(36363688)
        text_color = rgb(f2f4f8)
        text_color_inactive = rgba(be95ffee)
    }
}

decoration {
  rounding = 4
  rounding_power = 3
  shadow {
  enabled = yes
  render_power = 8
  range = 16
  color = rgba(161616ff)
  }
}


